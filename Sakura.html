<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Pagoda - Voxel Art</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none; /* 让点击穿透到 Canvas */
            color: rgba(255, 255, 255, 0.9);
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-weight: 300;
        }

        h1 span {
            color: #ff9eb5; /* 樱花粉 */
            font-weight: 600;
        }

        p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            backdrop-filter: blur(4px);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff9eb5;
            font-size: 1.2rem;
            letter-spacing: 3px;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>Sakura <span>Pagoda</span></h1>
        <p>沉浸式体素艺术 • 拖动探索</p>
    </div>

    <div id="loading">构建世界中...</div>
    <div id="canvas-container"></div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 OrbitControls -->
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 配置参数
        const CONFIG = {
            shadowMapSize: 2048,
            voxelSize: 1,
            groundSize: 60,
            treeCount: 18,
            petalCount: 300
        };

        // 材质定义
        const PALETTE = {
            pagodaRed: 0xc62828,
            pagodaGold: 0xffd700,
            pagodaWood: 0x4e342e,
            pagodaRoof: 0x263238,
            groundGrass: 0x558b2f,
            groundDirt: 0x3e2723,
            water: 0x4fc3f7,
            sakuraLeaf1: 0xf8bbd0,
            sakuraLeaf2: 0xf48fb1,
            sakuraLeaf3: 0xfce4ec,
            stone: 0x757575
        };

        // 全局变量
        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();
        const meshes = {}; // 存储不同材质的 InstancedMesh
        const dummy = new THREE.Object3D();
        let petals = []; // 粒子数组

        // 初始化
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. 场景与相机
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // 天空蓝
            scene.fog = new THREE.Fog(0x87CEEB, 40, 90); // 雾效增加深度

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-40, 35, 40);

            // 2. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 3. 控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // 防止穿透地面
            controls.minDistance = 10;
            controls.maxDistance = 80;
            controls.target.set(0, 5, 0);

            // 4. 光照
            setupLighting();

            // 5. 生成纹理 (程序化噪点，防止颜色过于单调)
            const texture = generateNoiseTexture();
            
            // 6. 初始化 InstancedMesh 容器
            initMeshes(texture);

            // 7. 构建世界
            buildWorld();

            // 8. 移除 Loading
            document.getElementById('loading').style.opacity = 0;
            setTimeout(() => document.getElementById('loading').remove(), 500);

            // 9. 事件监听
            window.addEventListener('resize', onWindowResize, false);

            // 10. 开始循环
            animate();
        }

        // --- 核心逻辑：初始化 InstancedMesh ---
        function initMeshes(texture) {
            // 创建基本的方块几何体
            const boxGeo = new THREE.BoxGeometry(CONFIG.voxelSize, CONFIG.voxelSize, CONFIG.voxelSize);
            
            // 定义材质组
            const materials = {
                [PALETTE.pagodaRed]: { color: PALETTE.pagodaRed, roughness: 0.6 },
                [PALETTE.pagodaGold]: { color: PALETTE.pagodaGold, roughness: 0.3, metalness: 0.8 },
                [PALETTE.pagodaWood]: { color: PALETTE.pagodaWood, roughness: 0.9 },
                [PALETTE.pagodaRoof]: { color: PALETTE.pagodaRoof, roughness: 0.8 },
                [PALETTE.groundGrass]: { color: PALETTE.groundGrass, roughness: 1.0 },
                [PALETTE.groundDirt]: { color: PALETTE.groundDirt, roughness: 1.0 },
                [PALETTE.water]: { color: PALETTE.water, roughness: 0.2, transparent: true, opacity: 0.8 },
                [PALETTE.sakuraLeaf1]: { color: PALETTE.sakuraLeaf1, roughness: 0.8 },
                [PALETTE.sakuraLeaf2]: { color: PALETTE.sakuraLeaf2, roughness: 0.8 },
                [PALETTE.sakuraLeaf3]: { color: PALETTE.sakuraLeaf3, roughness: 0.8 },
                [PALETTE.stone]: { color: PALETTE.stone, roughness: 0.9 }
            };

            // 为每种颜色创建一个 InstancedMesh，初始容量设大一点
            Object.keys(materials).forEach(key => {
                const matData = materials[key];
                const mat = new THREE.MeshStandardMaterial({
                    color: matData.color,
                    roughness: matData.roughness,
                    metalness: matData.metalness || 0,
                    transparent: matData.transparent || false,
                    opacity: matData.opacity || 1,
                    map: texture
                });
                
                // 初始实例数预估：地面(3600) + 宝塔(500) + 树(100*20) = ~6000
                const mesh = new THREE.InstancedMesh(boxGeo, mat, 6000);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                
                scene.add(mesh);
                
                meshes[key] = {
                    mesh: mesh,
                    count: 0
                };
            });
        }

        // --- 辅助函数：放置体素 ---
        function placeVoxel(x, y, z, colorPaletteKey) {
            if (!meshes[colorPaletteKey]) return;
            
            const group = meshes[colorPaletteKey];
            if (group.count >= group.mesh.count) return; // 防止溢出

            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            group.mesh.setMatrixAt(group.count, dummy.matrix);
            group.count++;
        }

        // --- 构建世界 ---
        function buildWorld() {
            // 1. 地面 (网格状噪点)
            const size = CONFIG.groundSize / 2;
            for (let x = -size; x <= size; x++) {
                for (let z = -size; z <= size; z++) {
                    // 简单的噪声生成地形
                    const dist = Math.sqrt(x*x + z*z);
                    if (dist > size) continue;

                    // 河流逻辑 (穿过中间)
                    let isWater = false;
                    let waterHeight = -1;
                    
                    // 弯曲的河流路径: sin 函数
                    const riverPath = Math.sin(x * 0.1) * 5;
                    if (Math.abs(z - riverPath) < 2) {
                        isWater = true;
                        waterHeight = -1;
                    }

                    if (isWater) {
                        // 河床泥土
                        placeVoxel(x, -2, z, PALETTE.groundDirt);
                        // 水面
                        placeVoxel(x, -1, z, PALETTE.water);
                    } else {
                        // 地面高度变化
                        const height = Math.floor(Math.random() * 1.5);
                        // 基础泥土
                        placeVoxel(x, height - 1, z, PALETTE.groundDirt);
                        // 草皮
                        placeVoxel(x, height, z, PALETTE.groundGrass);
                        
                        // 随机野花/装饰 (简单的小方块颜色变化)
                        if (Math.random() < 0.02) {
                             placeVoxel(x, height + 1, z, Math.random() > 0.5 ? 0xffeb3b : 0xff4081); // 使用非定义的Palettekey会跳过? 不，这里需要扩展palette或者只用已存在的。
                             // 为简化，我们仅在逻辑上处理，不扩展复杂的Palette
                             if (Math.random() > 0.5) placeVoxel(x, height + 1, z, PALETTE.sakuraLeaf1); // 小粉花
                        }
                    }
                }
            }

            // 2. 宝塔 (中心偏后)

            // 3. 桥梁 (横跨河流)
            buildBridge(0, 0, 0);

            // 4. 植被 (樱花树)
            for (let i = 0; i < CONFIG.treeCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 15 + Math.random() * 20; // 离宝塔一定距离
                const tx = Math.cos(angle) * radius;
                const tz = Math.sin(angle) * radius;
                
                // 避免种在河里
                const riverPath = Math.sin(tx * 0.1) * 5;
                if (Math.abs(tz - riverPath) < 3) continue;

                buildSakuraTree(tx, 1, tz, Math.random() * 0.5 + 0.8);
            }

            // 5. 最终更新所有 InstancedMesh
            Object.values(meshes).forEach(group => {
                group.mesh.instanceMatrix.needsUpdate = true;
            });

            // 6. 生成粒子系统
            createPetals();
        }

        // --- 构建樱花树 ---
        function buildSakuraTree(x, y, z, scale) {
            const height = Math.floor(6 * scale);
            
            // 树干
            for (let i = 0; i < height; i++) {
                placeVoxel(x, y + i, z, PALETTE.pagodaWood);
                // 树根
                if (i === 0) {
                    placeVoxel(x+1, y, z, PALETTE.pagodaWood);
                    placeVoxel(x-1, y, z, PALETTE.pagodaWood);
                    placeVoxel(x, y, z+1, PALETTE.pagodaWood);
                    placeVoxel(x, y, z-1, PALETTE.pagodaWood);
                }
            }

            // 树冠 (基于球体分布的体素)
            const crownRadius = Math.floor(4 * scale);
            const leafColors = [PALETTE.sakuraLeaf1, PALETTE.sakuraLeaf2, PALETTE.sakuraLeaf3];
            const crownCenter = y + height;

            for(let lx = -crownRadius; lx <= crownRadius; lx++) {
                for(let ly = -crownRadius/2; ly <= crownRadius; ly++) {
                    for(let lz = -crownRadius; lz <= crownRadius; lz++) {
                        const dist = Math.sqrt(lx*lx + ly*ly + lz*lz);
                        // 软边缘
                        if (dist < crownRadius && Math.random() > 0.2) {
                            const colorKey = leafColors[Math.floor(Math.random() * leafColors.length)];
                            placeVoxel(x + lx, crownCenter + ly, z + lz, colorKey);
                        }
                    }
                }
            }
        }

        // --- 构建桥 ---
        function buildBridge(x, y, z) {
            const width = 4;
            const length = 6;
            
            // 拱形逻辑：Y = x^2 * a
            for(let i = -length/2; i <= length/2; i++) {
                const bridgeY = y + 1 + (1 - Math.abs(i)/ (length/2)); // 中间高两头低
                
                // 桥面
                for(let w = -width/2; w <= width/2; w++) {
                    placeVoxel(x + w, bridgeY, z + i, PALETTE.pagodaWood);
                }
                // 栏杆
                if (Math.abs(i) < length/2) { // 不在最外层建栏杆
                     placeVoxel(x - width/2, bridgeY + 1, z + i, PALETTE.pagodaRed);
                     placeVoxel(x + width/2, bridgeY + 1, z + i, PALETTE.pagodaRed);
                     placeVoxel(x - width/2, bridgeY + 2, z + i, PALETTE.pagodaRed);
                     placeVoxel(x + width/2, bridgeY + 2, z + i, PALETTE.pagodaRed);
                }
            }
        }

        // --- 粒子系统：落花 ---
        function createPetals() {
            const geo = new THREE.PlaneGeometry(0.4, 0.4);
            // 使用简单的粉色材质
            const mat = new THREE.MeshBasicMaterial({ 
                color: 0xffd1dc, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.8
            });

            for(let i=0; i<CONFIG.petalCount; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                // 随机位置
                resetPetal(mesh, true);
                scene.add(mesh);
                petals.push({
                    mesh: mesh,
                    speedY: Math.random() * 0.02 + 0.01,
                    speedX: Math.random() * 0.02 - 0.01,
                    speedRot: Math.random() * 0.02,
                    rotOffset: Math.random() * Math.PI
                });
            }
        }

        function resetPetal(mesh, initial = false) {
            const range = 30;
            mesh.position.x = (Math.random() - 0.5) * range * 2;
            mesh.position.z = (Math.random() - 0.5) * range * 2;
            mesh.position.y = initial ? Math.random() * 20 : 20;
        }

        // --- 光照设置 ---
        function setupLighting() {
            // 环境光 (蓝色调模拟天空漫反射)
            const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambientLight);

            // 主光源 (太阳，暖色，产生阴影)
            const dirLight = new THREE.DirectionalLight(0xffa726, 1.2);
            dirLight.position.set(-50, 80, -30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = CONFIG.shadowMapSize;
            dirLight.shadow.mapSize.height = CONFIG.shadowMapSize;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 200;
            const d = 50;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // 补光 (紫色/粉色，增加艺术感)
            const hemiLight = new THREE.HemisphereLight(0xffe0b2, 0x7e57c2, 0.3);
            scene.add(hemiLight);
        }

        // --- 生成噪点纹理 (防止材质看起来像塑料) ---
        function generateNoiseTexture() {
            const size = 64;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,size,size);
            
            for(let i=0; i<400; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const grey = Math.floor(Math.random() * 50);
                ctx.fillStyle = `rgba(${grey},${grey},${grey}, 0.15)`;
                ctx.fillRect(x,y,2,2);
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            return texture;
        }

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // 1. 相机缓慢旋转展示 (如果用户没有交互)
            // controls.update(); // 如果 damping 为 true，需要每帧 update
            controls.update(); 

            // 2. 粒子动画
            petals.forEach(p => {
                p.mesh.position.y -= p.speedY;
                p.mesh.position.x += Math.sin(time + p.rotOffset) * 0.02 + p.speedX;
                p.mesh.rotation.x += p.speedRot;
                p.mesh.rotation.z += p.speedRot;

                if (p.mesh.position.y < 0) {
                    resetPetal(p.mesh);
                }
            });

            // 3. 简单的树摆动效果 (微调整个场景的某些部分比较复杂，这里通过粒子营造动感)

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 启动
        init();

    </script>
</body>
</html>
